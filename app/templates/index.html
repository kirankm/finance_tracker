<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #20242a;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 48px 24px;
      }

      .shell {
        margin: 0 auto;
        max-width: 960px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 7vw, 4.5rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 680px;
        color: #4b5563;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
        color: #146c43;
        font-size: 0.875rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #198754;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <div class="status"><span class="dot"></span>{{ environment }}</div>
        <h1>{{ app_name }}</h1>
        <p>Foundation app is running. Sprint 0 keeps this intentionally small while the ingestion, parser, ledger, and review workflows are built in later sprints.</p>
      </div>
    </main>
  </body>
</html>
